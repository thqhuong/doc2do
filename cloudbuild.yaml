substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: cloud-run-source-deploy
  _SERVICE: doc2do
  _GEMINI_MODEL: gemini-3.6-flash

steps:
  - id: build
    name: gcr.io/cloud-builders/docker@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - .

  - id: push
    name: gcr.io/cloud-builders/docker@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:d4d7a9a1e3d824db170e56764d5bfe39d9f23924cd51505e0792d360cbed209c
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=doc2do-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min=0
      - --max=2
      - --max-instances=2
      - --concurrency=20
      # Large files accepted by the 10 MB upload contract can take longer than
      # one minute for Gemini to inspect. Keep this bounded for cost safety.
      - --timeout=180s
      - --cpu-throttling
      - --set-env-vars=NODE_ENV=production,DOC2DO_DEMO_MODE=false,GEMINI_MODEL=${_GEMINI_MODEL}
      - --set-secrets=GEMINI_API_KEY=doc2do-gemini-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
